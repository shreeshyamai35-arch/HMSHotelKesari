# ─────────────────────────────────────────────────────────────
# Hotel Kesari — full production stack (portable, no vendor lock-in).
# Runs identically on Google Cloud VM, Oracle Cloud, Hetzner, AWS, Azure.
#
#   web  (nginx)  ──►  serves React SPA + reverse-proxies /api
#   backend       ──►  Node + Express API (Prisma → PostgreSQL)
#   db            ──►  PostgreSQL 16
#
# Usage:
#   1. cp .env.docker.example .env        (then edit secrets)
#   2. docker compose up -d --build
#   3. First boot only — seed demo data:
#        docker compose exec backend npm run db:seed
#      (or set SEED_ON_START=true in .env for the first `up`, then unset)
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kesari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kesari}
      POSTGRES_DB: ${POSTGRES_DB:-kesari}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kesari} -d ${POSTGRES_DB:-kesari}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT secret in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kesari}:${POSTGRES_PASSWORD:-kesari}@db:5432/${POSTGRES_DB:-kesari}?schema=public
      SEED_ON_START: ${SEED_ON_START:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Hotel Kesari <no-reply@hotelkesari.com>}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      PMS_PROVIDER: ${PMS_PROVIDER:-mock}
      EZEE_API_URL: ${EZEE_API_URL:-}
      EZEE_HOTEL_CODE: ${EZEE_HOTEL_CODE:-}
      EZEE_AUTH_CODE: ${EZEE_AUTH_CODE:-}
      CHECK_GRACE_MINUTES: ${CHECK_GRACE_MINUTES:-60}
      ENABLE_CRON: ${ENABLE_CRON:-true}
    volumes:
      - pdf_storage:/app/storage/pdf

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db_data:
  pdf_storage:
