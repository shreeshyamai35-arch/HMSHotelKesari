# ─────────────────────────────────────────────────────────────
# Nginx config for the Hotel Kesari web container.
# - Serves the React SPA (with history-API fallback).
# - Reverse-proxies /api/* to the backend service.
# For HTTPS/SSL, terminate TLS here (see docs/DEPLOYMENT.md) or front
# this container with Caddy/Certbot. Same image runs on any host.
# ─────────────────────────────────────────────────────────────

upstream kesari_api {
    # "backend" is the service name in docker-compose; 4000 is the API port.
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    # Allow larger report payloads (matches the API's 2mb json limit).
    client_max_body_size 5m;

    # Static SPA assets
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed build assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://kesari_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA history fallback — every other route returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
